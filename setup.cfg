[flake8]
exclude = .git,__pycache__
# Some rules to ignore because they are related to code formatting,
# which is now entirely managed by black, so if black and flake8
# disagree, silence flake8:
#   - E203 (whitespace before ':')
#   - E501 (line too long)
#   - W503 (line break before binary operator)
# Some additional rules we also ignore:
#   - A003 (class attribute shadowing a python builtin): Ignore
#     because the shadowing isn't actually true shadowing, as
#     the attribute can only be accessed through the object/class.
ignore = E203,E501,W503,A003
