    branchpoint: b737567fed7f672fd54b40967c6c0234ef257434
    branch-version: !!str 18
    # WARNING WARNING WARNING:
    # ------------------------
    #
    # Do not copy/paste blindly the version numbers from previous releases!
    #
    # For the first pre-release:
    #   - IF the first pre-release is created immediately after branch
    #     creation => Create a .0.90 pre-release.
    #   - Otherwise, create a .0.91 pre-release.
    do_release: !!str 18.0.90

